name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  run-tests:
    name: Run test cases
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.23', '1.24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests
        run: |
          make integration
          make integration_w_race

      - name: Run tests on 32-bit arch
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          make integration
        env:
          GOARCH: 386

  run-tests-windows:
    name: Run test cases (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The client integration tests do not build on Windows yet,
      # but the localfs tests run against both the package server and the sftp-server from Git for Windows.
      - name: Run tests
        shell: bash
        run: |
          go test -v -tags=integration,sftp.sync.metrics ./...
          cd localfs
          go test -v -tags=integration,sftp.sync.metrics -testserver=false
